name: Validate workflow template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Check AGENTS.md has all required sections
        run: |
          set -e
          required_sections=(
            "## Project Overview"
            "## Tech Stack"
            "## Key Conventions"
            "## Execution Environments"
            "## Change Tiering: Classify Before Starting"
            "## Workflow (MANDATORY per tier)"
            "## Testing"
            "## Auto-Merge Rules"
            "## Context Management (Automatic)"
            "## Hard Rules"
            "## Handling Ambiguity"
          )
          missing=0
          for section in "${required_sections[@]}"; do
            if ! grep -qF "$section" AGENTS.md; then
              echo "::error::Missing required section: $section"
              missing=1
            fi
          done
          exit $missing

      - name: Check placeholder tokens are well-formed
        run: |
          set -e
          # Every {{...}} placeholder must close on the same line.
          if grep -nE '\{\{[^}]*$' AGENTS.md; then
            echo "::error::Found an unclosed {{ placeholder above"
            exit 1
          fi
          # Every placeholder must be {{UPPER_SNAKE_CASE}}.
          if grep -noE '\{\{[^}]*\}\}' AGENTS.md | grep -vE '\{\{[A-Z][A-Z0-9_]*\}\}'; then
            echo "::error::Found a malformed placeholder above"
            exit 1
          fi

      - name: Check filled-in examples have no leftover placeholders
        run: |
          set -e
          if [ -d examples ] && grep -rnE '\{\{[A-Z0-9_]+\}\}' examples; then
            echo "::error::Placeholders left in examples/"
            exit 1
          fi
